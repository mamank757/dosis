<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My App - King Mamank</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100dvh;
            border: none;
            z-index: 1;
        }

        .btn-home {
            position: fixed;
            top: calc(25px + env(safe-area-inset-top, 0px));
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #27ae60;
            color: #fff;
            text-decoration: none;
            font-size: 24px;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 9999;
            transition: transform 0.2s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
            animation: pulse-green 2s infinite;
        }

        .btn-home:active {
            transform: scale(0.9);
            background: #1e8449;
        }

        @keyframes pulse-green {
            0%   { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 0 rgba(39,174,96,0.7); }
            70%  { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 10px rgba(39,174,96,0); }
            100% { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 0 rgba(39,174,96,0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-home { animation: none; }
        }
    </style>
</head>
<body>
    <a href="https://mamank757.github.io/PPL" class="btn-home" title="Kembali ke Dashboard" aria-label="Kembali ke Dashboard">🏠</a>

    <iframe
        title="Kalkulator Pupuk"
        src="https://script.google.com/macros/s/AKfycbzbVjncWe-C18kYWgCJEEvYFEoZlYPsgf2tyw9MCsa_5YosyoxtRuQIjBThZTiEEnFS/exec">
    </iframe>
</body>
</html>
